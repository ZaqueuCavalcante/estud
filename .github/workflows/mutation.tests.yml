name: Mutation Tests

on:
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.200

      - name: Restore
        run: dotnet restore

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run mutation tests
        working-directory: Tests
        run: dotnet stryker --output ./StrykerOutput

      - name: Collect report
        shell: bash
        run: |
          html=$(find Tests/StrykerOutput -name 'mutation-report.html' -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          cp -r "$(dirname "$html")" mutation
          mv mutation/mutation-report.html mutation/index.html
          cp .github/assets/stryker.svg mutation/favicon.svg
          sed -i '0,/<head>/s|<head>|<head><link rel="icon" type="image/svg+xml" href="favicon.svg">|' mutation/index.html
          ls -lah mutation

      - name: Generate mutation badge
        shell: bash
        run: |
          score=$(jq -r '
            [.files[].mutants[].status] as $s
            | ($s | map(select(. == "Killed" or . == "Timeout")) | length) as $detected
            | ($s | map(select(. == "Survived" or . == "NoCoverage")) | length) as $undetected
            | if $detected + $undetected == 0 then 0 else ($detected * 10000 / ($detected + $undetected) | round) / 100 end
          ' mutation/mutation-report.json)
          high=$(jq '."stryker-config".thresholds.high' Tests/stryker-config.json)
          low=$(jq '."stryker-config".thresholds.low' Tests/stryker-config.json)
          color=$(awk -v s="$score" -v h="$high" -v l="$low" 'BEGIN { print (s >= h ? "brightgreen" : s >= l ? "orange" : "red") }')
          logo=$(base64 -w0 .github/assets/stryker.svg)
          curl -fsSL -G -o mutation/badge.svg \
            --data-urlencode "logo=data:image/svg+xml;base64,${logo}" \
            "https://img.shields.io/badge/Mutation_Score-${score}%25-${color}"
          rm mutation/mutation-report.json

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.run_number }}
          path: mutation
          retention-days: 30

      - name: Publish to https://zaqueucavalcante.github.io/estud/mutation
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: mutation
          destination_dir: mutation
          keep_files: true
