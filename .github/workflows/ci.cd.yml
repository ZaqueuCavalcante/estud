name: CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.200

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Install native deps for PDF rendering
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Unit Tests
        run: |
          dotnet test --filter "FullyQualifiedName~UnitTests" \
          --no-restore \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --report-trx \
          --report-trx-filename unit_tests.trx \
          --coverage \
          --coverage-settings Tests/coverage.settings.xml \
          --coverage-output-format cobertura \
          --coverage-output unit.cobertura.xml \
          --results-directory ./TestResults

      - name: Integration Tests
        run: |
          dotnet test --filter "FullyQualifiedName!~UnitTests" \
          --configuration Release \
          --no-restore \
          --no-build \
          --verbosity normal \
          --report-trx \
          --report-trx-filename integration_tests.trx \
          --coverage \
          --coverage-settings Tests/coverage.settings.xml \
          --coverage-output-format cobertura \
          --coverage-output integration.cobertura.xml \
          --results-directory ./TestResults

      - name: Checkout coverage history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          sparse-checkout: history

      - name: Restore coverage history
        run: |
          mkdir -p coverage/history
          cp -r gh-pages/history/. coverage/history/ 2>/dev/null || true

      - name: Generate coverage HTML report
        id: coverage
        uses: danielpalme/ReportGenerator-GitHub-Action@v5.4.10
        with:
          reports: "**/*.cobertura.xml"
          targetdir: "coverage"
          historydir: "coverage/history"
          reporttypes: "HtmlInline_AzurePipelines;Cobertura;Badges"
          title: "Estud"
          tag: "${{ github.run_number }}_${{ github.sha }}"
          customSettings: "minimumCoverageThresholds:lineCoverage=96;minimumCoverageThresholds:branchCoverage=85"
          toolpath: "reportgeneratortool"

      - name: List coverage site contents
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        run: ls -lah coverage coverage/history

      - name: Publish Coverage to https://zaqueucavalcante.github.io/estud
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: coverage
          keep_files: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: Web/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: Web/pnpm-lock.yaml

      - name: Install Web dependencies
        working-directory: Web
        run: pnpm install --frozen-lockfile

      - name: Web Unit Tests
        working-directory: Web
        run: pnpm test
